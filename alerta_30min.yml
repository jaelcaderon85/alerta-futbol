name: Alerta minuto 30

on:
  schedule:
    # Cada hora al minuto 50: atiende los partidos de la hora siguiente (hora Bogotá)
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      probar:
        description: 'Solo enviar mensaje de prueba a Telegram'
        type: boolean
        default: true

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.probar }}" = "true" ]; then
            python alerta_30min.py --probar
          else
            python alerta_30min.py
          fi
